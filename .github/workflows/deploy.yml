name: Approved cloud deployment
on:
  workflow_dispatch:
    inputs:
      cost_approval:
        description: 'Enter APPROVED after reviewing qa/CLOUD_COST_AND_OPERATIONS.md'
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: false # Enable only after active free-trial credit and project linkage are verified.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen && uv run pytest -q
        working-directory: Maadhyam/apps/api
      - run: npm ci && npm run lint && npm run build
        working-directory: Maadhyam/apps/web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: maadhyam-1610
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - run: python scripts/validate_deployment.py
      - run: bash scripts/deploy.sh
        env:
          COST_APPROVED: APPROVED
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          ENABLE_SUPABASE_MIGRATION: ${{ vars.ENABLE_SUPABASE_MIGRATION }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TRIAL_CREDIT_CONFIRMED: ${{ vars.TRIAL_CREDIT_CONFIRMED }}
      - run: npx --yes firebase-tools@15 deploy --only hosting,firestore --project maadhyam-1610 --non-interactive
      - run: python scripts/hosted_smoke.py --url https://maadhyam-1610.web.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-smoke
          path: qa/evidence/m10-m12/
