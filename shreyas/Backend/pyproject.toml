[project]
name = "draft1-api"
version = "0.1.0"
description = "AI Builder Cup evidence intake API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9", "pydantic>=2,<3", "pypdf>=5,<7", "pillow>=11,<13"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/api"]
[tool.pytest.ini_options]
pythonpath = ["src"]
