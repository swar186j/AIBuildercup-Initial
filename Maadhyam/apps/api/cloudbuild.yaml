steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run -d --memory=512m --cpus=1 --name release-check -e MAADHYAM_PRODUCTION=true -e MAADHYAM_GEMINI_VERTEXAI=true -e MAADHYAM_GOOGLE_CLOUD_PROJECT=maadhyam-1610 -e MAADHYAM_FIRESTORE_DATABASE_ID=maadhyam ${_IMAGE}
        for attempt in {1..20}; do
          if docker exec release-check python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=2).status == 200'; then
            docker exec release-check python -c 'import urllib.request, urllib.error; r=urllib.request.Request("http://127.0.0.1:8080/api/ai/connection-test", data=b"", method="POST"); exec("try:\n urllib.request.urlopen(r)\n raise AssertionError(\"AI endpoint admitted unauthenticated request\")\nexcept urllib.error.HTTPError as e:\n assert e.code == 401")'
            exit 0
          fi
          sleep 1
        done
        docker logs release-check
        exit 1
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
